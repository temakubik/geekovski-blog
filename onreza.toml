#:schema https://docs.onreza.ru/schemas/onreza-project-v1.schema.json

[project]
id = "01a22150-acab-7581-8c6e-dfc1d281e901"
name = "geekovski-blog"
workspace = "nplx"

# Собираем на платформе тем же скриптом, что и локально: build.py кладёт готовый
# сайт в docs/. Единственная зависимость — Pillow.
[build]
# Pillow ставим внутри команды сборки: отдельный requirements.txt заставляет
# платформу определять проект как Python-приложение и требовать deploy.entry.
install_command = ""
command = "pip install --quiet pillow && python3 build.py --theme editorial --out docs --strict-images"
output_directory = "docs"

[deploy]
compute = "static"
