<!doctype html><meta charset=utf-8>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:768px; overflow:hidden; background:#0b0d11; }
  .frame { position:relative; width:1920px; height:768px; overflow:hidden; }
  .bg {
    position:absolute; inset:0;
    background-image:url("file:///Users/user/Projects/geekovski-blog/content/vk/img/vk-znakomstvo.jpg");
    background-size:cover;
    background-position:58% 32%;
    transform:scale(1.0);
    filter:saturate(.94) contrast(1.03);
  }
  .scrim {
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse 58% 88% at 50% 50%, rgba(5,7,11,.78) 0%, rgba(5,7,11,.50) 46%, rgba(5,7,11,0) 80%),
      linear-gradient(to bottom, rgba(6,8,12,.30) 0%, rgba(6,8,12,.10) 38%, rgba(6,8,12,.20) 72%, rgba(6,8,12,.48) 100%);
  }
  .logo {
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    width:600px;
    filter:drop-shadow(0 10px 34px rgba(0,0,0,.55));
  }
  .logo img { display:block; width:100%; }
</style>
<div class="frame">
  <div class="bg"></div>
  <div class="scrim"></div>
  <div class="logo"><img src="file:///Users/user/Projects/geekovski-blog/static/img/geekovski-logo.svg"></div>
</div>
