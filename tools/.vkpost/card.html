<!doctype html><meta charset=utf-8>
<style>
  @font-face {
    font-family: 'Medeo Mono';
    src: url("file:///Users/user/Projects/geekovski-blog/static/fonts/medeo-mono.woff2") format('woff2-variations');
    font-weight: 100 900;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; overflow:hidden; background:#0b0d11; }
  .card { position:relative; width:1080px; height:1350px; overflow:hidden; }
  .photo {
    position:absolute; inset:0;
    background-image:url("file:///Users/user/Projects/geekovski-blog/static/img/duo-sharnir-cover.jpg");
    background-size:cover;
    background-position:50% 42%;
    filter:saturate(.96) contrast(1.02);
  }
  .veil {
    position:absolute; inset:0;
    background:linear-gradient(to bottom,
      rgba(8,10,14,.30) 0%, rgba(8,10,14,0) 18%,
      rgba(8,10,14,0) 62%, rgba(8,10,14,.55) 84%, rgba(8,10,14,.94) 100%);
  }
  .brand {
    position:absolute; left:0; right:0; bottom:0;
    padding:0 56px 44px;
    display:flex; align-items:flex-end; justify-content:space-between; gap:24px;
  }
  .brand img { display:block; height:56px; width:auto; }
  .meta {
    font-family:'Medeo Mono', ui-monospace, monospace;
    font-weight:500; font-size:27px; line-height:1;
    letter-spacing:.16em; text-transform:uppercase;
    color:rgba(255,255,255,.78); white-space:nowrap;
    padding-bottom:6px;
  }
  .meta b { color:#fff; font-weight:600; }
  .rule { position:absolute; left:0; right:0; bottom:0; height:5px; background:#377BF0; }
</style>
<div class="card">
  <div class="photo"></div>
  <div class="veil"></div>
  <div class="brand">
    <img src="file:///Users/user/Projects/geekovski-blog/static/img/geekovski-logo.svg">
    <div class="meta"><b>GADGETS</b> · GEEKOVSKI.RU</div>
  </div>
  <div class="rule"></div>
</div>
