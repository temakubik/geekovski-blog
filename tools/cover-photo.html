<!DOCTYPE html><html lang='ru'><head><meta charset='utf-8'>
<link rel='stylesheet' href='https://geekovski.ru/assets/fonts.css'>
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:675px;background:#0A0C0F;color:#E9EBEE;font-family:'Medeo Sans',sans-serif;position:relative;overflow:hidden}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%}
.scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,12,15,.97) 0%,rgba(10,12,15,.88) 38%,rgba(10,12,15,.25) 72%,rgba(10,12,15,.05) 100%)}
.wrap{position:absolute;inset:0;padding:72px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between}
.kicker{font-family:'Medeo Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#C9F24D;font-weight:600}
.brand{display:flex;align-items:center;gap:9px;font-family:'Medeo Mono',monospace;font-size:11px;letter-spacing:.16em;color:#cfd4da;font-weight:600}
.brand img{width:22px;height:22px;display:block}
.h1{font-family:'Tiny5',sans-serif;font-size:64px;line-height:1.16;margin-top:auto;max-width:13ch}
.bot{margin-top:28px;display:flex;flex-direction:column;gap:6px;font-family:'Medeo Mono',monospace;font-size:12px;color:#8B939E}
.credit{font-size:10px;opacity:.7}
</style></head>
<body>
<img class='photo' src='../static/img/zelda-ocarina-switch-2.jpg' alt=''>
<div class='scrim'></div>
<div class='wrap'>
  <div class='top'><div class='kicker'>Nintendo Switch</div><div class='brand'><img src='../static/img/logo.svg' alt=''>GEEKOVSKI</div></div>
  <div class='h1'>Ocarina of Time выходит 5 ноября</div>
  <div class='bot'><span>2 ноября 2026</span><span class='credit'>фото: Crisco 1492 / Wikimedia</span></div>
</div>
</body></html>
