<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<!-- Источник картинки og-default.png (1200×630). Собирается tools/make_og.py:
     страница отдаётся локальным сервером, поэтому пути к ассетам абсолютные (/assets/…). -->
<link rel="stylesheet" href="/assets/fonts.css">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#0A0C0F;color:#E9EBEE;position:relative;overflow:hidden;
     font-family:'Medeo Sans',-apple-system,'Segoe UI',sans-serif}
body:before{content:'';position:absolute;inset:0;
  background:radial-gradient(700px 460px at 84% 4%,rgba(55,123,240,.16),transparent 70%),
             radial-gradient(500px 380px at 8% 96%,rgba(201,242,77,.06),transparent 70%)}
.in{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column}
.top{display:flex;align-items:center}
/* знак целиком — брендовый логотип: иконка + вордмарк, как в шапке сайта */
.top img{height:56px;width:auto;display:block}
.mid{margin-top:auto}
.h{font-family:'Random Grotesque Spacious','Medeo Sans',sans-serif;font-style:italic;font-weight:900;
   font-size:58px;line-height:1.06;letter-spacing:-.025em;color:#E9EBEE;max-width:22ch}
.h em{color:#C9F24D;font-style:italic}
.sub{font-size:21px;line-height:1.45;color:#8B939E;margin-top:18px;max-width:52ch}
/* метки и системная строка — Chava, как чипы и навигация на сайте */
.bot{margin-top:34px;padding-top:20px;border-top:1px solid #1F252E;display:flex;gap:14px;align-items:baseline;
     font-family:'Chava','Medeo Mono',monospace;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:#8B939E}
.bot b{color:#C9F24D;font-weight:400}
</style></head><body>
<div class="in">
  <div class="top">
    <img src="/assets/img/geekovski-logo.svg" alt="GEEKOVSKI" width="293" height="56">
  </div>
  <div class="mid">
    <div class="h">Технологии, игры и кино <em>без маркетингового сиропа</em></div>
    <div class="sub">Новые материалы каждый день: игры, платформы, VR, кино и сериалы — с источниками в каждом тексте.</div>
  </div>
  <div class="bot"><b>geekovski.ru</b><span>·</span><span>Xbox · Switch · PlayStation · PC · VR · Кино · Сериалы · AI</span></div>
</div>
</body></html>
