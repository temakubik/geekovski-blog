<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../static/fonts.css">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#0A0C0F;color:#E9EBEE;position:relative;overflow:hidden;
     font-family:'Medeo Sans',-apple-system,'Segoe UI',sans-serif}
body:before{content:'';position:absolute;inset:0;
  background:radial-gradient(700px 460px at 84% 4%,rgba(201,242,77,.12),transparent 70%),
             radial-gradient(500px 380px at 8% 96%,rgba(201,242,77,.06),transparent 70%)}
.in{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px}
.top img{width:56px;height:56px;display:block}
.word{font-family:'Tiny5',sans-serif;font-size:34px;letter-spacing:.02em;color:#E9EBEE}
.mid{margin-top:auto}
.h{font-family:'Tiny5',sans-serif;font-size:64px;line-height:1.22;color:#E9EBEE;max-width:24ch}
.h em{color:#C9F24D;font-style:normal}
.sub{font-size:21px;line-height:1.45;color:#8B939E;margin-top:16px;max-width:48ch}
.bot{margin-top:34px;padding-top:20px;border-top:1px solid #1F252E;display:flex;gap:16px;
     font-family:'Medeo Mono',monospace;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:#8B939E}
.bot b{color:#C9F24D;font-weight:600}
</style></head><body>
<div class="in">
  <div class="top">
    <img src="../static/img/logo.svg" alt="">
    <span class="word">GEEKOVSKI</span>
  </div>
  <div class="mid">
    <div class="h">Технологии, игры и кино <em>без маркетингового сиропа</em></div>
    <div class="sub">Дважды в день короткие дайджесты, между ними — большие разборы с источниками.</div>
  </div>
  <div class="bot"><b>geekovski.ru</b><span>·</span><span>Xbox · Switch · PlayStation · PC · Кино · Сериалы · AI</span></div>
</div>
</body></html>
